<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bài Tập JavaScript Cơ Bản</title>
    <!-- Google Fonts: Be Vietnam Pro -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body
    class="bg-[#e0f7fa] min-h-screen flex items-center justify-center p-4 sm:p-8 md:p-10 relative overflow-x-hidden font-sans text-slate-700"
  >
    <!-- Background Pastel Blobs -->
    <div class="fixed inset-0 pointer-events-none z-0 overflow-hidden">
      <div
        class="absolute -top-12 -right-12 w-[550px] h-[550px] bg-[#bbf7d0] rounded-full blur-[85px] opacity-60"
      ></div>
      <div
        class="absolute -bottom-20 -left-16 w-[600px] h-[600px] bg-[#bae6fd] rounded-full blur-[85px] opacity-60"
      ></div>
      <div
        class="absolute top-1/3 right-1/4 w-[400px] h-[400px] bg-[#ccfbf1] rounded-full blur-[75px] opacity-50"
      ></div>
    </div>

    <!-- Main Container Card -->
    <div
      class="relative z-10 w-full max-w-[960px] bg-white rounded-2xl shadow-[0_15px_45px_rgba(0,0,0,0.06)] border border-slate-100 flex flex-col md:flex-row overflow-hidden"
    >
      <!-- Sidebar Navigation -->
      <aside
        class="w-full md:w-[170px] bg-[#f4f6f9] border-b md:border-b-0 md:border-r border-slate-200/70 p-4 md:py-7 md:px-3.5 flex flex-col shrink-0"
      >
        <nav
          class="flex md:flex-col gap-2.5 overflow-x-auto md:overflow-visible"
        >
          <button
            class="tab-btn active w-full flex items-center justify-center gap-2 py-2 px-3 text-[14px] rounded-lg border transition-all cursor-pointer"
            data-tab="bai-1"
            id="tab-bai-1"
          >
            <span class="icon text-sm">📖</span>
            <span>Bài 1</span>
          </button>
          <button
            class="tab-btn w-full flex items-center justify-center gap-2 py-2 px-3 text-[14px] rounded-lg border transition-all cursor-pointer"
            data-tab="bai-2"
            id="tab-bai-2"
          >
            <span class="icon text-sm">📁</span>
            <span>Bài 2</span>
          </button>
          <button
            class="tab-btn w-full flex items-center justify-center gap-2 py-2 px-3 text-[14px] rounded-lg border transition-all cursor-pointer"
            data-tab="bai-3"
            id="tab-bai-3"
          >
            <span class="icon text-sm">📁</span>
            <span>Bài 3</span>
          </button>
          <button
            class="tab-btn w-full flex items-center justify-center gap-2 py-2 px-3 text-[14px] rounded-lg border transition-all cursor-pointer"
            data-tab="bai-4"
            id="tab-bai-4"
          >
            <span class="icon text-sm">📁</span>
            <span>Bài 4</span>
          </button>
        </nav>
      </aside>

      <!-- Main Content Area -->
      <main class="flex-1 p-6 md:p-9 bg-white flex flex-col">
        <!-- Tab Content 1: Xét tuyển đại học -->
        <section class="tab-content active flex flex-col" id="content-bai-1">
          <h2
            class="text-xl md:text-[22px] font-bold text-slate-800 mb-5 flex items-center gap-2.5"
          >
            <span class="text-2xl">🎓</span>
            <span>Xét tuyển đại học</span>
          </h2>

          <div
            class="bg-white border-l-4 border-[#00b4d8] rounded-r-lg p-4 md:p-5 shadow-[0_3px_15px_rgba(0,0,0,0.03)] border-t border-r border-b border-slate-100 mb-6"
          >
            <div class="flex flex-col">
              <div
                class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 mb-5"
              >
                <div>
                  <input
                    type="number"
                    id="diem-chuan"
                    placeholder="Điểm chuẩn"
                    min="0"
                    max="30"
                    step="any"
                    required
                    aria-label="Điểm chuẩn"
                    class="w-full bg-[#eef2f6] border border-slate-200 rounded-lg px-4 py-2.5 text-sm text-slate-800 placeholder-slate-400 outline-none focus:bg-white focus:border-blue-500 focus:ring-2 focus:ring-blue-100 transition-all"
                  />
                </div>
                <div>
                  <select
                    id="khu-vuc"
                    aria-label="Chọn khu vực"
                    class="w-full bg-[#eef2f6] border border-slate-200 rounded-lg px-4 py-2.5 text-sm text-slate-800 outline-none focus:bg-white focus:border-blue-500 focus:ring-2 focus:ring-blue-100 transition-all"
                  >
                    <option value="">Chọn khu vực</option>
                    <option value="A">A</option>
                    <option value="B">B</option>
                    <option value="C">C</option>
                    <option value="khac">Không thuộc khu vực ưu tiên</option>
                  </select>
                </div>
                <div>
                  <select
                    id="doi-tuong"
                    aria-label="Chọn đối tượng"
                    class="w-full bg-[#eef2f6] border border-slate-200 rounded-lg px-4 py-2.5 text-sm text-slate-800 outline-none focus:bg-white focus:border-blue-500 focus:ring-2 focus:ring-blue-100 transition-all"
                  >
                    <option value="">Chọn đối tượng</option>
                    <option value="1">Đối tượng 1</option>
                    <option value="2">Đối tượng 2</option>
                    <option value="3">Đối tượng 3</option>
                    <option value="khac">Không thuộc đối tượng ưu tiên</option>
                  </select>
                </div>
                <div>
                  <input
                    type="number"
                    id="diem-mon-1"
                    placeholder="Điểm môn thứ 1"
                    min="0"
                    max="10"
                    step="any"
                    required
                    aria-label="Điểm môn thứ nhất"
                    class="w-full bg-[#eef2f6] border border-slate-200 rounded-lg px-4 py-2.5 text-sm text-slate-800 placeholder-slate-400 outline-none focus:bg-white focus:border-blue-500 focus:ring-2 focus:ring-blue-100 transition-all"
                  />
                </div>
                <div>
                  <input
                    type="number"
                    id="diem-mon-2"
                    placeholder="Điểm môn thứ 2"
                    min="0"
                    max="10"
                    step="any"
                    required
                    aria-label="Điểm môn thứ hai"
                    class="w-full bg-[#eef2f6] border border-slate-200 rounded-lg px-4 py-2.5 text-sm text-slate-800 placeholder-slate-400 outline-none focus:bg-white focus:border-blue-500 focus:ring-2 focus:ring-blue-100 transition-all"
                  />
                </div>
                <div>
                  <input
                    type="number"
                    id="diem-mon-3"
                    placeholder="Điểm môn thứ 3"
                    min="0"
                    max="10"
                    step="any"
                    required
                    aria-label="Điểm môn thứ ba"
                    class="w-full bg-[#eef2f6] border border-slate-200 rounded-lg px-4 py-2.5 text-sm text-slate-800 placeholder-slate-400 outline-none focus:bg-white focus:border-blue-500 focus:ring-2 focus:ring-blue-100 transition-all"
                  />
                </div>
              </div>

              <div class="mb-5">
                <button
                  type="button"
                  id="btn-xet-tuyen"
                  class="bg-[#3b71ca] hover:bg-[#285192] text-white text-sm font-semibold px-8 py-2.5 rounded-full shadow-[0_4px_12px_rgba(59,113,202,0.35)] hover:shadow-[0_6px_16px_rgba(59,113,202,0.45)] transition-all cursor-pointer inline-flex items-center justify-center active:scale-[0.98]"
                >
                  Kết Quả
                </button>
              </div>

              <div
                class="bg-[#d6eed8] border border-[#c5e3c8] rounded-lg px-5 py-3.5 flex items-center gap-2.5 min-h-[50px] shadow-[inset_0_1px_2px_rgba(0,0,0,0.02)]"
              >
                <span class="text-base shrink-0 select-none">👉</span>
                <p
                  class="text-[14px] font-semibold text-[#14532d] break-words"
                  id="p-b1"
                  aria-live="polite"
                ></p>
              </div>
            </div>
          </div>
        </section>

        <!-- Tab Content 2: Tính tiền điện -->
        <section class="tab-content hidden flex-col" id="content-bai-2">
          <h2
            class="text-xl md:text-[22px] font-bold text-slate-800 mb-5 flex items-center gap-2.5"
          >
            <span class="text-2xl">⚡</span>
            <span>Tính tiền điện</span>
          </h2>
          <div
            class="bg-white border-l-4 border-[#00b4d8] rounded-r-lg p-4 md:p-5 shadow-[0_3px_15px_rgba(0,0,0,0.03)] border-t border-r border-b border-slate-100 mb-6"
          >
            <div class="flex flex-col">
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-5">
                <div>
                  <label for="ho-ten" class="block text-sm font-medium mb-1"
                    >Họ tên</label
                  >
                  <input
                    type="text"
                    id="ho-ten"
                    placeholder="Nhập họ tên"
                    class="w-full bg-[#eef2f6] border border-slate-200 rounded-lg px-4 py-2.5 text-sm text-slate-800 placeholder-slate-400 outline-none focus:bg-white focus:border-blue-500 focus:ring-2 focus:ring-blue-100 transition-all"
                  />
                </div>
                <div>
                  <label for="so-kw" class="block text-sm font-medium mb-1"
                    >Số điện tiêu thụ (kWh)</label
                  >
                  <input
                    type="number"
                    id="so-kw"
                    placeholder="Nhập số kWh"
                    min="0"
                    step="any"
                    class="w-full bg-[#eef2f6] border border-slate-200 rounded-lg px-4 py-2.5 text-sm text-slate-800 placeholder-slate-400 outline-none focus:bg-white focus:border-blue-500 focus:ring-2 focus:ring-blue-100 transition-all"
                  />
                </div>
              </div>

              <div class="mb-5">
                <button
                  type="button"
                  id="btn-tinh-tien-dien"
                  class="bg-[#3b71ca] hover:bg-[#285192] text-white text-sm font-semibold px-8 py-2.5 rounded-full shadow-[0_4px_12px_rgba(59,113,202,0.35)] hover:shadow-[0_6px_16px_rgba(59,113,202,0.45)] transition-all cursor-pointer inline-flex items-center justify-center active:scale-[0.98]"
                >
                  Tính tiền điện
                </button>
              </div>

              <div
                class="bg-[#d6eed8] border border-[#c5e3c8] rounded-lg px-5 py-3.5 flex items-center gap-2.5 min-h-[50px] shadow-[inset_0_1px_2px_rgba(0,0,0,0.02)]"
              >
                <span class="text-base shrink-0 select-none">👉</span>
                <p
                  class="text-[14px] font-semibold text-[#14532d] break-words"
                  id="p-b2"
                  aria-live="polite"
                ></p>
              </div>
            </div>
          </div>
        </section>

        <!-- Tab Content 3: Tính thuế thu nhập cá nhân -->
        <section class="tab-content hidden flex-col" id="content-bai-3">
          <h2
            class="text-xl md:text-[22px] font-bold text-slate-800 mb-5 flex items-center gap-2.5"
          >
            <span class="text-2xl">🧾</span>
            <span>Tính thuế thu nhập cá nhân</span>
          </h2>

          <div
            class="bg-white border-l-4 border-[#00b4d8] rounded-r-lg p-4 md:p-5 shadow-[0_3px_15px_rgba(0,0,0,0.03)] border-t border-r border-b border-slate-100 mb-6"
          >
            <div class="flex flex-col">
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-5">
                <div>
                  <label
                    for="ho-ten-thue"
                    class="block text-sm font-medium mb-1"
                    >Họ tên</label
                  >
                  <input
                    type="text"
                    id="ho-ten-thue"
                    placeholder="Nhập họ tên"
                    class="w-full bg-[#eef2f6] border border-slate-200 rounded-lg px-4 py-2.5 text-sm text-slate-800 placeholder-slate-400 outline-none focus:bg-white focus:border-blue-500 focus:ring-2 focus:ring-blue-100 transition-all"
                  />
                </div>
                <div>
                  <label
                    for="tong-thu-nhap"
                    class="block text-sm font-medium mb-1"
                    >Tổng thu nhập (VND)</label
                  >
                  <input
                    type="number"
                    id="tong-thu-nhap"
                    placeholder="Tổng thu nhập năm"
                    min="0"
                    step="any"
                    class="w-full bg-[#eef2f6] border border-slate-200 rounded-lg px-4 py-2.5 text-sm text-slate-800 placeholder-slate-400 outline-none focus:bg-white focus:border-blue-500 focus:ring-2 focus:ring-blue-100 transition-all"
                  />
                </div>
                <div>
                  <label
                    for="so-nguoi-phu-thuoc"
                    class="block text-sm font-medium mb-1"
                    >Số người phụ thuộc</label
                  >
                  <input
                    type="number"
                    id="so-nguoi-phu-thuoc"
                    placeholder="Nhập số người phụ thuộc"
                    min="0"
                    step="1"
                    class="w-full bg-[#eef2f6] border border-slate-200 rounded-lg px-4 py-2.5 text-sm text-slate-800 placeholder-slate-400 outline-none focus:bg-white focus:border-blue-500 focus:ring-2 focus:ring-blue-100 transition-all"
                  />
                </div>
              </div>

              <div class="mb-5">
                <button
                  type="button"
                  id="btn-tinh-thue"
                  class="bg-[#3b71ca] hover:bg-[#285192] text-white text-sm font-semibold px-8 py-2.5 rounded-full shadow-[0_4px_12px_rgba(59,113,202,0.35)] hover:shadow-[0_6px_16px_rgba(59,113,202,0.45)] transition-all cursor-pointer inline-flex items-center justify-center active:scale-[0.98]"
                >
                  Tính thuế
                </button>
              </div>

              <div
                class="bg-[#d6eed8] border border-[#c5e3c8] rounded-lg px-5 py-3.5 flex items-center gap-2.5 min-h-[50px] shadow-[inset_0_1px_2px_rgba(0,0,0,0.02)]"
              >
                <span class="text-base shrink-0 select-none">👉</span>
                <p
                  class="text-[14px] font-semibold text-[#14532d] break-words"
                  id="p-b3"
                  aria-live="polite"
                ></p>
              </div>
            </div>
          </div>
        </section>

        <!-- Tab Content 4: Tính tiền cáp -->
        <section class="tab-content hidden flex-col" id="content-bai-4">
          <h2
            class="text-xl md:text-[22px] font-bold text-slate-800 mb-5 flex items-center gap-2.5"
          >
            <span class="text-2xl">📡</span>
            <span>Tính tiền cáp</span>
          </h2>

          <div
            class="bg-white border-l-4 border-[#00b4d8] rounded-r-lg p-4 md:p-5 shadow-[0_3px_15px_rgba(0,0,0,0.03)] border-t border-r border-b border-slate-100 mb-6"
          >
            <div class="flex flex-col">
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-5">
                <div>
                  <label
                    for="loai-khach-hang"
                    class="block text-sm font-medium mb-1"
                    >Loại khách hàng</label
                  >
                  <select
                    id="loai-khach-hang"
                    class="w-full bg-[#eef2f6] border border-slate-200 rounded-lg px-4 py-2.5 text-sm text-slate-800 outline-none focus:bg-white focus:border-blue-500 focus:ring-2 focus:ring-blue-100 transition-all"
                  >
                    <option value="">-- Chọn loại khách hàng --</option>
                    <option value="nhaDan">Nhà dân</option>
                    <option value="doanhNghiep">Doanh nghiệp</option>
                  </select>
                </div>
                <div>
                  <label
                    for="ma-khach-hang"
                    class="block text-sm font-medium mb-1"
                    >Mã khách hàng</label
                  >
                  <input
                    type="text"
                    id="ma-khach-hang"
                    placeholder="Nhập mã khách hàng"
                    class="w-full bg-[#eef2f6] border border-slate-200 rounded-lg px-4 py-2.5 text-sm text-slate-800 placeholder-slate-400 outline-none focus:bg-white focus:border-blue-500 focus:ring-2 focus:ring-blue-100 transition-all"
                  />
                </div>
                <div>
                  <label
                    for="so-kenh-cao-cap"
                    class="block text-sm font-medium mb-1"
                    >Số kênh cao cấp</label
                  >
                  <input
                    type="number"
                    id="so-kenh-cao-cap"
                    placeholder="Nhập số kênh cao cấp"
                    min="0"
                    step="1"
                    class="w-full bg-[#eef2f6] border border-slate-200 rounded-lg px-4 py-2.5 text-sm text-slate-800 placeholder-slate-400 outline-none focus:bg-white focus:border-blue-500 focus:ring-2 focus:ring-blue-100 transition-all"
                  />
                </div>
                <div id="so-ket-noi-container" class="hidden">
                  <label for="so-ket-noi" class="block text-sm font-medium mb-1"
                    >Số kết nối</label
                  >
                  <input
                    type="number"
                    id="so-ket-noi"
                    placeholder="Nhập số kết nối"
                    min="0"
                    step="1"
                    class="w-full bg-[#eef2f6] border border-slate-200 rounded-lg px-4 py-2.5 text-sm text-slate-800 placeholder-slate-400 outline-none focus:bg-white focus:border-blue-500 focus:ring-2 focus:ring-blue-100 transition-all"
                  />
                </div>
              </div>

              <div class="mb-5">
                <button
                  type="button"
                  id="btn-tinh-tien-cap"
                  class="bg-[#3b71ca] hover:bg-[#285192] text-white text-sm font-semibold px-8 py-2.5 rounded-full shadow-[0_4px_12px_rgba(59,113,202,0.35)] hover:shadow-[0_6px_16px_rgba(59,113,202,0.45)] transition-all cursor-pointer inline-flex items-center justify-center active:scale-[0.98]"
                >
                  Tính tiền cáp
                </button>
              </div>

              <div
                class="bg-[#d6eed8] border border-[#c5e3c8] rounded-lg px-5 py-3.5 flex items-center gap-2.5 min-h-[50px] shadow-[inset_0_1px_2px_rgba(0,0,0,0.02)]"
              >
                <span class="text-base shrink-0 select-none">👉</span>
                <p
                  class="text-[14px] font-semibold text-[#14532d] break-words"
                  id="p-b4"
                  aria-live="polite"
                ></p>
              </div>
            </div>
          </div>
        </section>
      </main>
    </div>
    <script src="./js/b1.js"></script>
    <script src="./js/b2.js"></script>
    <script src="./js/b3.js"></script>
    <script src="./js/b4.js"></script>
    <script>
      const tabButtons = document.querySelectorAll(".tab-btn");
      const tabContents = document.querySelectorAll(".tab-content");

      tabButtons.forEach((button) => {
        button.addEventListener("click", () => {
          const selectedTab = button.dataset.tab;

          tabButtons.forEach((tabButton) => {
            const isSelected = tabButton === button;
            tabButton.classList.toggle("active", isSelected);
            tabButton.querySelector(".icon").textContent = isSelected
              ? "📖"
              : "📁";
          });

          tabContents.forEach((content) => {
            const isSelected = content.id === `content-${selectedTab}`;
            content.classList.toggle("active", isSelected);
            content.classList.toggle("hidden", !isSelected);
          });
        });
      });
    </script>
  </body>
</html>
